name: CPU example
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quick-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4
      - run: python -m pip install "torch>=2.5,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -B tools/quick_example.py
      - run: python -B tools/verify_package.py --source-only
